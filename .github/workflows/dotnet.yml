name: CI .NET

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore "Softball Scorer.sln"

      - name: Build
        run: dotnet build "Softball Scorer.sln" --configuration Release --no-restore

      - name: Test
        run: dotnet test "Softball Scorer.sln" --no-build --configuration Release --verbosity minimal
