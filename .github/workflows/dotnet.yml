name: CI .NET

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore web
        run: dotnet restore "Scoreboard.Web/Scoreboard.Web.csproj"

      - name: Restore tests
        run: dotnet restore "tests/Scoreboard.Tests/Scoreboard.Tests.csproj"

      - name: Build web
        run: dotnet build "Scoreboard.Web/Scoreboard.Web.csproj" --configuration Release --no-restore

      - name: Test
        run: dotnet test "tests/Scoreboard.Tests/Scoreboard.Tests.csproj" --configuration Release --no-restore --verbosity minimal
